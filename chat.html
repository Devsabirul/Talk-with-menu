<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restaurant AI Chatbot</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f3f6fa;
      font-family: Arial, sans-serif;
      height: 100vh;
      overflow: hidden;
    }
    .chat-wrapper {
      max-width: 850px;
      height: 100vh;
      margin: auto;
      display: flex;
      flex-direction: column;
      background: white;
      box-shadow: 0 0 30px rgba(0,0,0,.06);
    }
    .chat-header {
      padding: 20px 25px;
      background: #172033;
      color: white;
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .restaurant-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: #15945f;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }
    .restaurant-title {
      font-size: 19px;
      font-weight: 700;
      margin: 0;
    }
    .online-status {
      font-size: 12px;
      color: #8ee6bd;
      margin-top: 4px;
    }
    .chat-info {
      margin-left: auto;
      text-align: right;
      font-size: 11px;
      color: #b9c5d5;
      max-width: 190px;
      overflow-wrap: anywhere;
    }
    .chat-body {
      flex: 1;
      padding: 25px;
      overflow-y: auto;
      background: #f8fafc;
    }
    .message-row {
      display: flex;
      margin-bottom: 18px;
    }
    .message-row.user {
      justify-content: flex-end;
    }
    .message {
      max-width: 75%;
      padding: 13px 16px;
      border-radius: 13px;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .bot .message {
      background: white;
      border: 1px solid #e5eaf1;
      color: #263449;
      border-top-left-radius: 3px;
    }
    .user .message {
      background: #15945f;
      color: white;
      border-top-right-radius: 3px;
    }
    .message-time {
      font-size: 10px;
      color: #94a3b8;
      margin-top: 5px;
    }
    .chat-footer {
      padding: 18px 22px;
      background: white;
      border-top: 1px solid #e5eaf1;
    }
    .input-group {
      border: 1px solid #dbe2eb;
      border-radius: 10px;
      padding: 5px;
      background: white;
    }
    .input-group .form-control {
      border: 0;
      box-shadow: none;
      padding: 12px;
    }
    .send-btn {
      background: #15945f;
      color: white;
      border: 0;
      border-radius: 8px;
      padding: 0 20px;
    }
    .send-btn:hover {
      background: #107a4e;
      color: white;
    }
    .send-btn:disabled {
      opacity: .6;
    }
    .footer-note {
      text-align: center;
      font-size: 11px;
      color: #94a3b8;
      margin-top: 10px;
    }
    .typing {
      color: #64748b;
      font-size: 13px;
      padding: 8px 0;
    }
    .error-message {
      background: #fff1f2;
      border: 1px solid #fecdd3;
      color: #be123c;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 15px;
    }
    @media(max-width: 600px) {
      .chat-header { padding: 15px; }
      .chat-body { padding: 15px; }
      .chat-footer { padding: 12px; }
      .chat-info { display: none; }
      .message { max-width: 88%; }
    }
  </style>
</head>
<body>
<div class="chat-wrapper">
  <header class="chat-header">
    <div class="restaurant-icon">
      <i class="bi bi-shop"></i>
    </div>
<div>
  <h1 class="restaurant-title" id="restaurantName">Restaurant AI</h1>
  <div class="online-status">
    <i class="bi bi-circle-fill me-1"></i>
    AI Assistant
  </div>
</div>
<div class="chat-info">
  <div>Restaurant Vector ID</div>
  <div id="restaurantId">Loading...</div>
</div>
  </header>
  <main class="chat-body" id="chatBody">
<div class="message-row bot">
  <div>
    <div class="message" id="welcomeMessage">
      Hello! Welcome. How can I help you with our restaurant menu?
    </div>
    <div class="message-time">AI Assistant</div>
  </div>
</div>
  </main>
  <footer class="chat-footer">
<div id="errorBox" class="error-message" style="display:none;"></div>
<form id="chatForm">
  <div class="input-group">
    <input
      type="text"
      id="questionInput"
      class="form-control"
      placeholder="Ask something about the menu..."
      autocomplete="off"
      required
    >
    <button type="submit" class="send-btn" id="sendBtn">
      <i class="bi bi-send-fill"></i>
    </button>
  </div>
</form>
<div class="footer-note">
  Powered by Restaurant AI
</div>
  </footer>
</div>
<script>
  // Read restaurant information from URL.
  const params = new URLSearchParams(window.location.search);
  const restaurantId = params.get("restaurant_id");
  const restaurantName = params.get("restaurant_name") || "Restaurant AI";
  const apiUrl = (params.get("api") || "https://restaurant-ai-waiter-api.onrender.com")
    .replace(/\/+$/, "");
  const restaurantNameElement = document.getElementById("restaurantName");
  const restaurantIdElement = document.getElementById("restaurantId");
  const chatBody = document.getElementById("chatBody");
  const chatForm = document.getElementById("chatForm");
  const questionInput = document.getElementById("questionInput");
  const sendBtn = document.getElementById("sendBtn");
  const errorBox = document.getElementById("errorBox");
  restaurantNameElement.textContent = restaurantName;
  restaurantIdElement.textContent = restaurantId || "Not provided";
  document.title = restaurantName + " — AI Chatbot";
  // Prevent chatbot use if restaurant ID is missing.
  if (!restaurantId) {
    questionInput.disabled = true;
    sendBtn.disabled = true;
    showError("Restaurant ID is missing. Please open the chatbot from the upload dashboard.");
  }
  function getTime() {
    return new Date().toLocaleTimeString([], {
      hour: "2-digit",
      minute: "2-digit"
    });
  }
  function addMessage(text, sender) {
    const row = document.createElement("div");
    row.className = "message-row " + sender;
    const wrapper = document.createElement("div");
    const bubble = document.createElement("div");
    bubble.className = "message";
    bubble.textContent = text;
    const time = document.createElement("div");
    time.className = "message-time";
    time.textContent = sender === "user" ? "You · " + getTime() : "AI Assistant · " + getTime();
    wrapper.appendChild(bubble);
    wrapper.appendChild(time);
    row.appendChild(wrapper);
    chatBody.appendChild(row);
    chatBody.scrollTop = chatBody.scrollHeight;
  }
  function showError(message) {
    errorBox.textContent = message;
    errorBox.style.display = "block";
  }
  function hideError() {
    errorBox.style.display = "none";
  }
  function showTyping() {
    const typing = document.createElement("div");
    typing.id = "typingIndicator";
    typing.className = "typing";
    typing.textContent = restaurantName + " AI is typing...";
    chatBody.appendChild(typing);
    chatBody.scrollTop = chatBody.scrollHeight;
  }
  function removeTyping() {
    const typing = document.getElementById("typingIndicator");
    if (typing) typing.remove();
  }
  function getAnswer(data) {
    // Supports common API response formats.
    if (typeof data === "string") return data;
    return (
      data.answer ||
      data.response ||
      data.message ||
      data.reply ||
      data.result ||
      data.ai_response ||
      "I couldn't find an answer. Please try another question."
    );
  }
  chatForm.addEventListener("submit", async function (e) {
    e.preventDefault();
    const question = questionInput.value.trim();
    if (!question || !restaurantId) return;
    hideError();
    addMessage(question, "user");
    questionInput.value = "";
    questionInput.disabled = true;
    sendBtn.disabled = true;
    showTyping();
    try {
      const response = await fetch(
        apiUrl + "/api/chat/" + encodeURIComponent(restaurantId),
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            question: question
          })
        }
      );
      const data = await response.json();
      removeTyping();
      if (!response.ok) {
        throw new Error(
          data.detail || data.message || "Chat API request failed."
        );
      }
      const answer = getAnswer(data);
      addMessage(String(answer), "bot");
    } catch (error) {
      removeTyping();
      showError(error.message || "Unable to connect to the chatbot.");
    } finally {
      questionInput.disabled = false;
      sendBtn.disabled = false;
      questionInput.focus();
    }
  });
</script>
</body>
</html>
